apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airline-api-ingress
  namespace: airline-backend-prod
spec:
  ingressClassName: nginx
  rules:
  - host: api.ghoshsourav21.in
    http:
      paths:
      - path: /search
        pathType: Prefix
        backend:
          service:
            name: flight-search-service
            port:
              number: 80
      - path: /book
        pathType: Prefix
        backend:
          service:
            name: booking-management-service
            port:
              number: 80
